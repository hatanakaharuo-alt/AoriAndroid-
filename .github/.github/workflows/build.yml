name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o project.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: src/AoriSensor
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp src/AoriSensor/app/build/outputs/apk/debug/app-debug.apk AoriSensor.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: アオリイカセンサー build ${{ github.run_number }}
          files: AoriSensor.apk
